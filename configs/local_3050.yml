# Local smoke-test configuration for an RTX 3050 (4 GB) laptop GPU.
# Tiny model + short run: verifies the full pipeline end to end in minutes.
model:
  vocab_size: null
  block_size: 256
  n_layer: 4
  n_embd: 256
  n_head: 8
  n_head_kv: 2
  intermediate_size: 768
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  attention_bias: false
  tie_embeddings: true
  use_sdpa: true

tokenizer:
  name: TinyLlama/TinyLlama-1.1B-intermediate-step-1431k-3T
  revision: main
  local_files_only: false

training:
  batch_size: 8
  learning_rate: 6.0e-4
  weight_decay: 0.1
  max_steps: 200
  warmup_steps: 20
  min_learning_rate: 6.0e-5
  max_grad_norm: 1.0
  log_interval: 10
  eval_interval: 100
  checkpoint_interval: 100
  checkpoint_dir: checkpoints/local_3050_test
  mixed_precision: true
  seed: 42

data:
  root: data/splits
  train_split: train
  validation_split: val
  source_weights:
    fineweb-edu-dedup: 0.75
    cosmopedia-v2: 0.15
    python-edu: 0.10
